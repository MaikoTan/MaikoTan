# Auto-generate GitHub / WakaTime stats cards and commit them to the repo.
name: Generate stats

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # GITHUB_TOKEN only sees public repos; a PAT with `repo` scope
      # (STATS_TOKEN) is required for private-repo stats.
      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&theme=tokyonight
          path: stats/github-stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&langs_count=10&size_weight=1&count_weight=0&theme=tokyonight
          path: stats/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=MaikoTan&langs_count=10&layout=compact&theme=tokyonight
          path: stats/wakatime-stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Use GITHUB_TOKEN here: the pin card only needs a public repo, and a
      # restricted fine-grained PAT can fail to resolve other orgs.
      - name: Generate koishi pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=koishijs&repo=koishi&theme=tokyonight
          path: stats/pin-koishi.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "chore: update stats cards"
          git push
