# Auto-generate GitHub / WakaTime stats cards and commit them to the repo.
name: Generate stats

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # GITHUB_TOKEN only sees public repos; a PAT with `repo` scope
      # (STATS_TOKEN) is required for private-repo stats.
      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&theme=dark
          path: stats/github-stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate WakaTime stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          options: username=MaikoTan&langs_count=10&layout=compact&theme=dark
          path: stats/wakatime-stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "chore: update stats cards"
          git push
